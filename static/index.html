<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Strategy Profiler</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        .form-group { margin-bottom: 1.25rem; }
        label { font-weight: 600; display: block; margin-bottom: 0.4rem; }
        textarea { width: 100%; height: 90px; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        input[type="file"] { border: 1px solid #ccc; padding: 0.5rem; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0059b3; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 1.25rem; border-radius: 8px; margin-top: 1rem; }
        .badge { display: inline-block; background: #e2e8f0; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        ul { margin: 0.5rem 0; padding-left: 1.25rem; }
        li { margin-bottom: 0.25rem; }
        .video-btn { display: inline-block; margin-top: 0.25rem; padding: 0.4rem 0.8rem; background: #ff0000; color: white; text-decoration: none; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
        .video-btn:hover { background: #cc0000; }
    </style>
</head>
<body>
    <h2>🏓 Pickleball Opponent Profiler</h2>
    
    <div class="form-group">
        <label for="videoFile">Upload Short Video Clip (10-20 seconds max):</label>
        <input type="file" id="videoFile" accept="video/mp4,video/mov,video/quicktime">
    </div>

    <div class="form-group">
        <label for="notes">Additional Opponent Notes (Optional):</label>
        <textarea id="notes" placeholder="e.g. Weak backhand reach, poaches often on 3rd shot, drops high..."></textarea>
    </div>

    <button onclick="analyzeMatch()">Generate Tactical Plan</button>

    <div id="status" style="margin-top: 1rem; font-weight: 500; color: #666;"></div>
    
    <div id="results" style="display:none;">
        <div class="card">
            <h3>Scout Report</h3>
            <p id="scoutSummary"></p>
            <strong>Weaknesses Exploit List:</strong>
            <ul id="scoutWeaknesses"></ul>
        </div>
        
        <div class="card" style="border-left: 4px solid #0070f3;">
            <span class="badge">GAME PLAN</span>
            <h3 id="planHeadline" style="margin-top: 0.25rem;"></h3>
            <strong>Tactical Action Items:</strong>
            <ul id="planTactics"></ul>
            <p><strong>Mental Coach Cue:</strong> <em id="coachCue"></em></p>
            
            <div style="margin-top: 1rem; border-top: 1px solid #ddd; padding-top: 0.75rem;">
                <strong>📺 Recommended Drill Videos:</strong>
                <div id="videoList" style="margin-top: 0.5rem;"></div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeMatch() {
            const fileInput = document.getElementById("videoFile");
            const notesInput = document.getElementById("notes").value;
            const status = document.getElementById("status");
            const results = document.getElementById("results");

            if (!fileInput.files[0] && !notesInput.trim()) {
                return alert("Please upload a video clip or enter text notes.");
            }

            status.innerText = "Analyzing video & text via LangGraph agent loop...";
            results.style.display = "none";

            // Prepare multipart form data payload
            const formData = new FormData();
            if (fileInput.files[0]) {
                formData.append("file", fileInput.files[0]);
            }
            formData.append("opponent_notes", notesInput);

            try {
                const res = await fetch("/api/analyze", {
                    method: "POST",
                    body: formData // Browser sets multipart boundary header automatically
                });

                if (!res.ok) throw new Error("API call failed.");

                const data = await res.json();
                
                // Render Scout output
                document.getElementById("scoutSummary").innerText = data.scout_analysis.summary;
                document.getElementById("scoutWeaknesses").innerHTML = data.scout_analysis.weaknesses.map(w => `<li>${w}</li>`).join("");

                // Render Game Plan output
                document.getElementById("planHeadline").innerText = data.tactical_plan.headline;
                document.getElementById("planTactics").innerHTML = data.tactical_plan.tactics.map(t => `<li>${t}</li>`).join("");
                document.getElementById("coachCue").innerText = `"${data.tactical_plan.coach_cue}"`;
                
                // Render YouTube Links
                const videoDiv = document.getElementById("videoList");
                videoDiv.innerHTML = data.tactical_plan.recommended_videos.map(v => `
                    <div style="margin-bottom: 0.5rem;">
                        <div>• <strong>${v.title}</strong></div>
                        <a href="${v.url}" target="_blank" class="video-btn">Search YouTube ➔</a>
                    </div>
                `).join("");
                
                status.innerText = `Optimization complete (${data.iterations} iteration pass).`;
                results.style.display = "block";
            } catch (err) {
                status.innerText = "Error analyzing match: " + err.message;
            }
        }
    </script>
</body>
</html>
