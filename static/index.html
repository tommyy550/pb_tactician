<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pickleball Match Analyzer</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 100px; padding: 0.5rem; margin-bottom: 1rem; }
        button { padding: 0.5rem 1rem; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .card { background: #f4f4f5; padding: 1rem; border-radius: 6px; margin-top: 1rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Pickleball Opponent Match Profiler</h2>
    <p>Enter notes on your opponent's playstyle, serve, backhand, third-shot choices, or kitchen habits:</p>
    
    <textarea id="notes" placeholder="e.g., Heavy speedup on off-hip, weak backhand dink, drops third shot high..."></textarea>
    <button onclick="analyze()">Generate Tactical Plan</button>

    <div id="status"></div>
    
    <div id="results" style="display:none;">
        <h3>Scout Report</h3>
        <div id="scoutReport" class="card"></div>
        
        <h3>Tactical Game Plan</h3>
        <div id="tacticalPlan" class="card"></div>
    </div>

    <script>
        async function analyze() {
            const notes = document.getElementById("notes").value;
            const status = document.getElementById("status");
            const results = document.getElementById("results");

            if (!notes) return alert("Please enter some opponent notes.");

            status.innerText = "Analyzing opponent tendencies & refining tactics...";
            results.style.display = "none";

            try {
                const res = await fetch("/api/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ opponent_notes: notes })
                });

                const data = await res.json();
                
                document.getElementById("scoutReport").innerText = data.scout_analysis;
                document.getElementById("tacticalPlan").innerText = data.tactical_plan;
                
                status.innerText = `Completed in ${data.iterations} critique iteration(s).`;
                results.style.display = "block";
            } catch (err) {
                status.innerText = "Error analyzing match: " + err.message;
            }
        }
    </script>
</body>
</html>
