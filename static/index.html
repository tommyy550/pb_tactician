<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Match Profiler</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 750px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        textarea { width: 100%; height: 100px; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { margin-top: 0.5rem; padding: 0.75rem 1.5rem; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0059b3; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 1.25rem; border-radius: 8px; margin-top: 1rem; }
        .badge { display: inline-block; background: #e2e8f0; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        ul { margin: 0.5rem 0; padding-left: 1.25rem; }
        li { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <h2>🏓 Pickleball Opponent Profiler</h2>
    <p>Enter raw notes about your opponent's playstyle, serve, backhand, or kitchen habits:</p>
    
    <textarea id="notes" placeholder="e.g., Aggressive poacher, deep sidespin serve, weak backhand reach, drops 3rd shot high..."></textarea><br>
    <button onclick="analyze()">Generate Tactical Game Plan</button>

    <div id="status" style="margin-top: 1rem; font-weight: 500; color: #666;"></div>
    
    <div id="results" style="display:none;">
        <div class="card">
            <h3>Scout Report</h3>
            <p id="scoutSummary"></p>
            <strong>Weaknesses to Exploit:</strong>
            <ul id="scoutWeaknesses"></ul>
        </div>
        
        <div class="card" style="border-left: 4px solid #0070f3;">
            <span class="badge">GAME PLAN</span>
            <h3 id="planHeadline" style="margin-top: 0.25rem;"></h3>
            <strong>Tactical Action Items:</strong>
            <ul id="planTactics"></ul>
            <p><strong>Mental Cue:</strong> <em id="coachCue"></em></p>
        </div>
    </div>

    <script>
        async function analyze() {
            const notes = document.getElementById("notes").value;
            const status = document.getElementById("status");
            const results = document.getElementById("results");

            if (!notes.trim()) return alert("Please enter opponent notes.");

            status.innerText = "Running multi-agent analysis & refinement loop...";
            results.style.display = "none";

            try {
                const res = await fetch("/api/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ opponent_notes: notes })
                });

                if (!res.ok) throw new Error("API call failed.");

                const data = await res.json();
                
                // Populate Scout UI
                document.getElementById("scoutSummary").innerText = data.scout_analysis.summary;
                const weaknessesList = document.getElementById("scoutWeaknesses");
                weaknessesList.innerHTML = data.scout_analysis.weaknesses.map(w => `<li>${w}</li>`).join("");

                // Populate Tactics UI
                document.getElementById("planHeadline").innerText = data.tactical_plan.headline;
                const tacticsList = document.getElementById("planTactics");
                tacticsList.innerHTML = data.tactical_plan.tactics.map(t => `<li>${t}</li>`).join("");
                document.getElementById("coachCue").innerText = `"${data.tactical_plan.coach_cue}"`;
                
                status.innerText = `Optimization complete (${data.iterations} critique loop pass).`;
                results.style.display = "block";
            } catch (err) {
                status.innerText = "Error analyzing match: " + err.message;
            }
        }
    </script>
</body>
</html>
